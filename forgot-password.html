<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | Spectrum Credit Limited</title>

  <script>window.location.replace('index.html?view=forgot');</script>

  <script>
    const loggedInUser = JSON.parse(sessionStorage.getItem('loggedInUser') || 'null');
    if (loggedInUser) {
      window.location.replace('index.html');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #12195f;          /* logo / headings */
      --ink: #0f1a3d;
      --muted: #6b7280;
      --label: #111827;
      --orange: #e8792b;
      --blue: #3b78e7;          /* primary button */
      --blue-hover: #2f66cc;
      --link: #2563eb;
      --danger: #c0392b;
      --border: #d9dde5;
      --overlay: rgba(25, 38, 100, 0.5);

      /* Replace with your own hero photo */
      --hero-image: url("hero.jpg");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
    }

    .page {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      min-height: 100vh;
    }

    /* ---------- Left: brand panel ---------- */
    .brand {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 64px 56px 72px;
      color: #fff;
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--hero-image) center / cover no-repeat,
        #2a3a7a;
      overflow: hidden;
    }

    .brand-logo-card {
      width: 238px;
      background: #fff;
      border-radius: 14px;
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }

    .brand h2 {
      font-size: clamp(28px, 2.6vw, 38px);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
    }

    .brand p {
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.55;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      max-width: 34ch;
    }

    /* ---------- Right: form ---------- */
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .form-wrap { width: 100%; max-width: 330px; }

    .form-logo { margin-bottom: 36px; }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--label);
    }
    label .req { color: var(--danger); margin-left: 2px; }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #8b93a3; }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 120, 231, 0.18);
    }

    .field.invalid input {
      border-color: #c8503f;
      box-shadow: 0 0 0 3px rgba(200, 80, 63, 0.16);
    }

    .error {
      display: none;
      margin: 6px 0 0 4px;
      font-size: 13px;
      color: var(--danger);
    }
    .field.invalid .error { display: block; }

    .submit {
      width: 100%;
      height: 46px;
      margin-top: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .submit:hover { background: var(--blue-hover); }
    .submit:focus-visible { outline: 3px solid rgba(59,120,231,.4); outline-offset: 2px; }
    .submit[disabled] { opacity: .7; cursor: progress; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--link);
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; }
      .brand { display: none; }
      .panel { min-height: 100vh; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Brand panel -->
    <section class="brand" aria-label="Spectrum Credit Limited">
      <div class="brand-logo-card">
        <!-- Replace this SVG with your logo file: <img src="logo.png" alt="Spectrum Credit Limited" /> -->
        <svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Spectrum Credit Limited. We don't just lend. We empower.">
          <path d="M142 38 L176 8 L168 30 Z" fill="#e8792b"/>
          <text x="160" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                font-style="italic" font-weight="800" font-size="62" fill="#12195f" letter-spacing="-2">Spectrum</text>
          <line x1="6"   y1="95" x2="62"  y2="95" stroke="#e8792b" stroke-width="2.5"/>
          <line x1="258" y1="95" x2="314" y2="95" stroke="#e8792b" stroke-width="2.5"/>
          <text x="160" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                font-weight="700" font-size="19" fill="#e8792b" letter-spacing="1">CREDIT LIMITED</text>
          <text x="160" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                font-size="17" fill="#12195f">We Don't Just Lend. We Empower.</text>
        </svg>
      </div>

      <h2>Secure. Transparent. Reliable.</h2>
      <p>Spectrum Credit Limited portal — Logbook Asset Finance Core Banking Platform</p>
    </section>

    <!-- Form panel -->
    <section class="panel">
      <div class="form-wrap">

        <div class="form-logo">
          <svg viewBox="0 0 320 130" width="130" role="img" aria-label="Spectrum Credit Limited">
            <path d="M142 38 L176 8 L168 30 Z" fill="#12195f"/>
            <text x="160" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                  font-style="italic" font-weight="800" font-size="62" fill="#12195f" letter-spacing="-2">Spectrum</text>
            <line x1="6"   y1="95" x2="62"  y2="95" stroke="#e8792b" stroke-width="2.5"/>
            <line x1="258" y1="95" x2="314" y2="95" stroke="#e8792b" stroke-width="2.5"/>
            <text x="160" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                  font-weight="700" font-size="19" fill="#e8792b" letter-spacing="1">CREDIT LIMITED</text>
            <text x="160" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                  font-size="17" fill="#12195f">We Don't Just Lend. We Empower.</text>
          </svg>
        </div>

        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <form id="reset-form" novalidate>
          <div class="field" id="email-field">
            <div class="label-row">
              <label for="email">Email Address<span class="req">*</span></label>
            </div>
            <div class="input-wrap">
              <input id="email" name="email" type="email" autocomplete="username"
                     placeholder="you@example.com" aria-describedby="email-error" />
            </div>
            <p class="error" id="email-error" role="alert">Email is required</p>
          </div>

          <button class="submit" type="submit" id="submit">Send Reset Link</button>
        </form>

        <a class="back-link" href="login.html">Back to Sign In</a>

      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("reset-form");
    const email = document.getElementById("email");
    const emailField = document.getElementById("email-field");
    const emailError = document.getElementById("email-error");

    function validateEmail() {
      const value = email.value.trim();
      let msg = "";
      if (!value) msg = "Email is required";
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) msg = "Enter a valid email address";
      emailError.textContent = msg;
      emailField.classList.toggle("invalid", !!msg);
      return !msg;
    }

    email.addEventListener("blur", validateEmail);
    email.addEventListener("input", () => emailField.classList.contains("invalid") && validateEmail());

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!validateEmail()) return email.focus();

      const btn = document.getElementById("submit");
      btn.disabled = true;
      btn.textContent = "Sending…";
      try {
        // Simulate sending reset email
        alert("If an account with that email exists, a password reset link has been sent.");
        // In a real app, this would send a request to the server
      } catch (err) {
        alert("An error occurred. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
