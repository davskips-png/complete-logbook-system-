<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | Spectrum Credit Limited</title>

  <script>
    window.location.replace('index.html');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy: #12195f;          /* logo / headings */
      --ink: #0f1a3d;
      --muted: #6b7280;
      --label: #111827;
      --orange: #e8792b;
      --blue: #3b78e7;          /* primary button */
      --blue-hover: #2f66cc;
      --link: #2563eb;
      --danger: #c0392b;
      --border: #d9dde5;
      --overlay: rgba(25, 38, 100, 0.5);

      /* Replace with your own hero photo */
      --hero-image: url("hero.jpg");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: #fff;
    }

    .page {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      min-height: 100vh;
    }

    /* ---------- Left: brand panel ---------- */
    .brand {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 64px 56px 72px;
      color: #fff;
      background:
        linear-gradient(var(--overlay), var(--overlay)),
        var(--hero-image) center / cover no-repeat,
        #2a3a7a;
      overflow: hidden;
    }

    .brand-logo-card {
      width: 238px;
      background: #fff;
      border-radius: 14px;
      padding: 14px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }

    .brand h2 {
      font-size: clamp(28px, 2.6vw, 38px);
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 18px;
    }

    .brand p {
      font-size: clamp(15px, 1.25vw, 18px);
      line-height: 1.55;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.88);
      max-width: 34ch;
    }

    /* ---------- Right: form ---------- */
    .panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }

    .form-wrap { width: 100%; max-width: 330px; }

    .form-logo { margin-bottom: 36px; }

    h1 {
      font-size: 30px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 36px;
    }

    .field { margin-bottom: 20px; }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--label);
    }
    label .req { color: var(--danger); margin-left: 2px; }

    .forgot {
      font-size: 13px;
      font-weight: 500;
      color: var(--link);
      text-decoration: none;
    }
    .forgot:hover { text-decoration: underline; }

    .input-wrap { position: relative; }

    input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 14px;
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #8b93a3; }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(59, 120, 231, 0.18);
    }

    .field.invalid input {
      border-color: #c8503f;
      box-shadow: 0 0 0 3px rgba(200, 80, 63, 0.16);
    }

    .error {
      display: none;
      margin: 6px 0 0 4px;
      font-size: 13px;
      color: var(--danger);
    }
    .field.invalid .error { display: block; }

    .icon-btn {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: #374151;
      cursor: pointer;
    }
    .icon-btn:hover { background: #f1f3f7; }
    .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

    .submit {
      width: 100%;
      height: 46px;
      margin-top: 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--blue);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
    }
    .submit:hover { background: var(--blue-hover); }
    .submit:focus-visible { outline: 3px solid rgba(59,120,231,.4); outline-offset: 2px; }
    .submit[disabled] { opacity: .7; cursor: progress; }

    /* ---------- Responsive ---------- */
    @media (max-width: 860px) {
      .page { grid-template-columns: 1fr; }
      .brand { display: none; }
      .panel { min-height: 100vh; }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- Brand panel -->
    <section class="brand" aria-label="Spectrum Credit Limited">
      <div class="brand-logo-card">
        <!-- Replace this SVG with your logo file: <img src="logo.png" alt="Spectrum Credit Limited" /> -->
        <svg viewBox="0 0 320 130" width="100%" role="img" aria-label="Spectrum Credit Limited. We don't just lend. We empower.">
          <path d="M142 38 L176 8 L168 30 Z" fill="#e8792b"/>
          <text x="160" y="82" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
                font-style="italic" font-weight="800" font-size="62" fill="#12195f" letter-spacing="-2">Spectrum</text>
          <line x1="6"   y1="95" x2="62"  y2="95" stroke="#e8792b" stroke-width="2.5"/>
          <line x1="258" y1="95" x2="314" y2="95" stroke="#e8792b" stroke-width="2.5"/>
          <text x="160" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                font-weight="700" font-size="19" fill="#e8792b" letter-spacing="1">CREDIT LIMITED</text>
          <text x="160" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                font-size="17" fill="#12195f">We Don't Just Lend. We Empower.</text>
        </svg>
      </div>

      <h2>Secure. Transparent. Reliable.</h2>
      <p>Spectrum Credit Limited portal — Logbook Asset Finance Core Banking Platform</p>
    </section>

    <!-- Form panel -->
    <section class="panel">
      <div class="form-wrap">

        <div class="form-logo">
          <svg viewBox="0 0 320 130" width="130" role="img" aria-label="Spectrum Credit Limited">
            <path d="M142 38 L176 8 L168 30 Z" fill="#12195f" letter-spacing="-2">Spectrum</text>
            <line x1="6"   y1="95" x2="62"  y2="95" stroke="#e8792b" stroke-width="2.5"/>
            <line x1="258" y1="95" x2="314" y2="95" stroke="#e8792b" stroke-width="2.5"/>
            <text x="160" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                  font-weight="700" font-size="19" fill="#e8792b" letter-spacing="1">CREDIT LIMITED</text>
            <text x="160" y="124" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
                  font-size="17" fill="#12195f">We Don't Just Lend. We Empower.</text>
          </svg>
        </div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Please sign in to your account</p>

        <form id="login-form" novalidate autocomplete="off">
          <div class="field" id="email-field">
            <div class="label-row">
              <label for="email">Email Address<span class="req">*</span></label>
            </div>
            <div class="input-wrap">
              <input id="email" name="email" type="email" autocomplete="off" autocapitalize="none" spellcheck="false"
                     placeholder="you@example.com" aria-describedby="email-error" />
            </div>
            <p class="error" id="email-error" role="alert">Email is required</p>
          </div>

          <div class="field" id="password-field">
            <div class="label-row">
              <label for="password">Password<span class="req">*</span></label>
              <a class="forgot" href="forgot-password.html">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false"
                     placeholder="Enter your password" aria-describedby="password-error" />
              <button type="button" class="icon-btn" id="toggle-password" aria-label="Show password" aria-pressed="false">
                <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <p class="error" id="password-error" role="alert">Password is required</p>
          </div>

          <button class="submit" type="submit" id="submit">Sign In</button>
        </form>

      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const emailField = document.getElementById("email-field");
    const passwordField = document.getElementById("password-field");
    const emailError = document.getElementById("email-error");
    const toggle = document.getElementById("toggle-password");
    const eyeIcon = document.getElementById("eye-icon");

    const DEFAULT_DEMO_PASSWORD = 'Spectrum@2026';
    const EYE = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
    const EYE_OFF = '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';

    function getDemoStaff() {
      return [
        { id: 'ST-001', name: 'Branch Admin User', email: 'branchadmin@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345678', gender: 'MALE', role: 'BRANCH_ADMIN', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-002', name: 'Risk Officer User', email: 'riskofficer@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345679', gender: 'FEMALE', role: 'RISK_OFFICER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-003', name: 'Credit Risk Manager User', email: 'creditriskmanager@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345680', gender: 'MALE', role: 'CREDIT_RISK_MANAGER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-004', name: 'Credit Admin User', email: 'creditadmin@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345681', gender: 'FEMALE', role: 'CREDIT_ADMIN', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-005', name: 'Finance Officer User', email: 'financeofficer@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345682', gender: 'MALE', role: 'FINANCE_OFFICER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-006', name: 'Finance Manager User', email: 'financemanager@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345683', gender: 'FEMALE', role: 'FINANCE_MANAGER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-007', name: 'Collection Officer User', email: 'collectionofficer@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345684', gender: 'MALE', role: 'COLLECTION_OFFICER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-008', name: 'Collection Manager User', email: 'collectionmanager@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345685', gender: 'FEMALE', role: 'COLLECTION_MANAGER', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-009', name: 'Overall Admin User', email: 'overalladmin@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345686', gender: 'MALE', role: 'OVERALL_ADMIN', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-010', name: 'Super Admin User', email: 'superadmin@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345687', gender: 'FEMALE', role: 'SUPER_ADMIN', branch: 'BR-001', status: 'ACTIVE' },
        { id: 'ST-011', name: 'CEO Committee User', email: 'ceocommittee@spectrum.com', password: DEFAULT_DEMO_PASSWORD, phone: '0712345688', gender: 'MALE', role: 'CEO_COMMITTEE', branch: 'BR-001', status: 'ACTIVE' }
      ];
    }

    function getStaffRecords() {
      const STORAGE_KEY = 'SPECTRUM_LMS_LOS_DATA_V1';
      let data = null;
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          data = JSON.parse(stored);
        }
      } catch (error) {
        console.warn('Could not read from localStorage', error);
      }

      const staff = Array.isArray(data?.staff) ? data.staff : getDemoStaff();
      const normalized = staff.map(member => ({
        ...member,
        email: String(member.email || '').trim(),
        password: member.password ? String(member.password) : DEFAULT_DEMO_PASSWORD,
        status: member.status || 'ACTIVE'
      }));

      if (!data || !Array.isArray(data.staff) || data.staff.length !== normalized.length || data.staff.some((member, index) => member.password !== normalized[index].password)) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...(data || {}), staff: normalized }));
        } catch (_) {
          // Ignore persistence failures so login remains available in the browser session.
        }
      }

      return normalized;
    }

    function findActiveStaffMember(email, staffList = getStaffRecords()) {
      const normalizedEmail = String(email || '').trim().toLowerCase();
      if (!normalizedEmail) return null;

      let match = (Array.isArray(staffList) ? staffList : [])
        .find(member => String(member.email || '').trim().toLowerCase() === normalizedEmail && String(member.status || 'ACTIVE') === 'ACTIVE');

      if (match) return match;

      return getDemoStaff().find(member => String(member.email || '').trim().toLowerCase() === normalizedEmail && String(member.status || 'ACTIVE') === 'ACTIVE') || null;
    }

    function validateEmail() {
      const value = email.value.trim();
      let msg = "";
      if (!value) msg = "Email is required";
      else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) msg = "Enter a valid email address";
      emailError.textContent = msg;
      emailField.classList.toggle("invalid", !!msg);
      return !msg;
    }

    function validatePassword() {
      const ok = password.value.length > 0;
      passwordField.classList.toggle("invalid", !ok);
      return ok;
    }

    email.addEventListener("blur", validateEmail);
    email.addEventListener("input", () => emailField.classList.contains("invalid") && validateEmail());
    password.addEventListener("input", () => passwordField.classList.contains("invalid") && validatePassword());

    toggle.addEventListener("click", () => {
      const show = password.type === "password";
      password.type = show ? "text" : "password";
      eyeIcon.innerHTML = show ? EYE_OFF : EYE;
      toggle.setAttribute("aria-pressed", String(show));
      toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const okEmail = validateEmail();
      const okPass = validatePassword();
      if (!okEmail) return email.focus();
      if (!okPass) return password.focus();

      const btn = document.getElementById("submit");
      btn.disabled = true;
      btn.textContent = "Signing in…";
      try {
        const userEmail = email.value.trim().toLowerCase();
        const userPassword = password.value;
        const staff = getStaffRecords();
        let user = findActiveStaffMember(userEmail, staff);

        if (!user) {
          user = findActiveStaffMember(userEmail, getDemoStaff());
        }

        if (!user) {
          throw new Error("We couldn't find an active account for that email. Please check the email address or use a known demo user.");
        }

        const passwordMatches = String(user.password || '').length > 0
          ? user.password === userPassword
          : userPassword.length > 0;

        if (!passwordMatches) {
          throw new Error("Incorrect password. Please try again or use the demo password shown in the setup notes.");
        }

        sessionStorage.setItem('loggedInUser', JSON.stringify(user));
        window.location.href = 'index.html';
      } catch (err) {
        alert(err.message || 'Login failed. Please check your email and password.');
      } finally {
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
